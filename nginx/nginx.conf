upstream keycloak {
    server keycloak-dev:8080;
}

upstream test_client {
    server test-client:3002;
}

upstream mock_idp {
    server mock-idp-backend:3001;
}

# Rate limiting
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

server {
    listen 80;
    server_name localhost;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Root location - redirect to test client
    location = / {
        return 301 /app;
    }

    # Test Client Application
    location /app/ {
        limit_req zone=general burst=20 nodelay;
        
        rewrite ^/app/(.*) /$1 break;
        proxy_pass http://test_client;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        
        # WebSocket support (falls benötigt)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Test Client root redirect
    location = /app {
        return 301 /app/;
    }

    # Keycloak Admin Console & Admin API
    location /admin {
        limit_req zone=auth burst=10 nodelay;
        
        proxy_pass http://keycloak/admin;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Keycloak benötigt diese Header für korrekte URL-Generierung
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        
        # Timeouts für Auth-Flows
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }

    # Keycloak Realms (wichtig für OIDC)
    location /realms {
        limit_req zone=auth burst=10 nodelay;
        
        proxy_pass http://keycloak/realms;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Keycloak Resources (CSS, JS, etc.)
    location /resources {
        proxy_pass http://keycloak/resources;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # Caching für statische Ressourcen
        proxy_cache_valid 200 1h;
        proxy_cache_bypass $http_pragma $http_authorization;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Keycloak JS Adapter
    location /js {
        proxy_pass http://keycloak/js;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_cache_valid 200 1h;
    }

    # Mock IDP (für Custom Extension)
    location /mock-idp/ {
        limit_req zone=general burst=20 nodelay;
        
        rewrite ^/mock-idp/(.*) /$1 break;
        proxy_pass http://mock_idp;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Mock IDP root redirect
    location = /mock-idp {
        return 301 /mock-idp/;
    }

    # Mock IDP select endpoint (called from verify page)
    location /select {
        limit_req zone=general burst=20 nodelay;
        
        proxy_pass http://mock_idp/select;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Nginx status (optional, für Monitoring)
    location /nginx-status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        allow 172.16.0.0/12;  # Docker/Podman networks
        deny all;
    }
}
