version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: keycloak-postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - keycloak-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.2
    container_name: keycloak-dev
    environment:
      # Admin User (Keycloak 26.x - new variables)
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      
      # Database Configuration
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      
      # Debug Configuration
      DEBUG: "true"
      DEBUG_PORT: "*:5005"
      JAVA_OPTS_KC_HEAP: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
      
      # Development Mode
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_LOG_LEVEL: INFO
    ports:
      - "8081:8080"
      - "9000:9000"  # Management interface
      - "5005:5005"
    volumes:
      - ./providers:/opt/keycloak/providers:z
    networks:
      - keycloak-network
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - start-dev
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000;echo -e 'GET /health/ready HTTP/1.1\r\nhost: 127.0.0.1\r\nConnection: close\r\n\r\n' >&3;if [ $? -eq 0 ]; then echo 'Healthcheck Successful';exit 0;else echo 'Healthcheck Failed';exit 1;fi;"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  mock-idp:
    build: ./mock-idp/backend
    container_name: mock-idp-backend
    environment:
      NODE_ENV: development
      PORT: 3001
      ISSUER_URL: http://mock-idp-backend:3001
      KEY_PATH: /app/keys
    volumes:
      - ./mock-idp/backend/keys:/app/keys:z
      - ./mock-idp/backend/src:/app/src:z
    ports:
      - "3001:3001"
    networks:
      - keycloak-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  keycloak-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
